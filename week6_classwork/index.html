<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <div class="container my-5 p-4 bg-secondary rounded">
        <div class="row g-3">
            
            <div class="col-md-3">
                <div class="border border-dark border-3 p-3 text-center bg-warning text-dark fw-bold">Logo</div>
            </div>
            
            <div class="col-md-9">
                <div class="border border-dark border-3 p-3 text-center bg-info text-dark fw-bold">Header</div>
            </div>
            
            <div class="col-12">
                <div class="border border-dark border-3 p-3 text-center bg-primary text-white fw-bold">Banner</div>
            </div>
            
            <div class="col-md-2">
                <div class="border border-dark border-3 p-3 text-center bg-success text-white fw-bold" style="min-height: 200px;">Navigation</div>
            </div>
            
            <div class="col-md-8">
                <div class="border border-dark border-3 p-3 text-center bg-light text-dark fw-bold" style="min-height: 200px;">Main Content</div>
            </div>
            
            <div class="col-md-2">
                <div class="border border-dark border-3 p-3 text-center bg-danger text-white fw-bold" style="min-height: 200px;">Ads</div>
            </div>
            
            <div class="col-12">
                <div class="border border-dark border-3 p-3 text-center bg-dark text-white fw-bold">Footer</div>
            </div>
            
        </div>
    </div>
</body>
</html>
